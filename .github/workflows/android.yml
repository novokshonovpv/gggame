name: Android APK

# Builds an installable debug APK of the game on every push to main (and on demand).
# Download it from the run's "Artifacts" section.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The Ubuntu runner image ships the Android SDK (ANDROID_HOME); Gradle fetches the rest.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk moto-trials.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moto-trials-apk
          path: moto-trials.apk
