<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5aa9e6" />
    <title>Moto Trials</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <button id="btn-menu" class="icon" aria-label="Меню">☰</button>
        <div class="center">
          <div id="track-name"></div>
          <div class="hud-bar">
            <div class="cell"><span class="lbl">Поз</span><b id="pos">1/4</b></div>
            <div class="cell main"><span class="lbl">Время</span><b id="time">0:00.00</b></div>
            <div class="cell"><span class="lbl">Круг</span><b id="lap">1/1</b></div>
          </div>
          <div id="progress"><div id="progress-fill"></div></div>
        </div>
        <button id="btn-restart" class="icon" aria-label="Заново">↻</button>
      </div>
      <ul id="missions"></ul>
      <div id="toast" class="hidden"></div>
      <div id="countdown" class="hidden"></div>
    </div>

    <div id="controls" class="hidden">
      <div class="pad left">
        <button data-action="back" aria-label="Наклон назад">◀</button>
        <button data-action="fwd" aria-label="Наклон вперёд">▶</button>
      </div>
      <div class="pad right">
        <button data-action="brake" class="brake" aria-label="Тормоз">■</button>
        <button data-action="gas" class="gas" aria-label="Газ">▲</button>
      </div>
    </div>

    <div id="crash" class="hidden"><span>Падение!</span></div>

    <div id="menu" class="overlay">
      <div class="panel">
        <h1>Moto Trials</h1>
        <div class="menu-bar">
          <span class="coins" id="menu-coins">0</span>
          <span class="star-count" id="menu-stars">0 ★</span>
          <button id="btn-garage" class="garage-btn">Гараж</button>
        </div>
        <div class="toggles">
          <button id="tgl-sfx" class="tgl" aria-pressed="true">Звук</button>
          <button id="tgl-music" class="tgl" aria-pressed="true">Музыка</button>
        </div>
        <p class="sub">Выбери трассу</p>
        <div id="track-list"></div>
        <p class="keys">
          Клавиатура: <b>↑</b> газ · <b>↓</b> тормоз · <b>← →</b> наклон · <b>R</b> заново · <b>Esc</b> меню
        </p>
      </div>
    </div>

    <div id="results" class="overlay hidden">
      <div class="panel">
        <h2 id="res-place">Финиш</h2>
        <div id="res-time" class="big"></div>
        <div id="res-best"></div>
        <div id="res-reward"></div>
        <ol id="res-table"></ol>
        <ul id="res-missions"></ul>
        <div class="row">
          <button id="res-retry">Ещё раз</button>
          <button id="res-next" class="primary">Следующая</button>
        </div>
        <button id="res-menu" class="link">Все трассы</button>
      </div>
    </div>

    <div id="garage" class="overlay hidden">
      <div class="panel wide">
        <div class="garage-head">
          <h2>Гараж</h2>
          <span class="coins" id="garage-coins">0</span>
        </div>
        <h3>Улучшения</h3>
        <div id="upgrades"></div>
        <h3>Раскраска</h3>
        <div id="paints"></div>
        <button id="garage-close" class="primary-wide">К трассам</button>
      </div>
    </div>

    <div id="rotate"><span>⟳</span>Поверни телефон горизонтально</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
